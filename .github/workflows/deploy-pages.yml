name: Déployer Mon Petit Génie (GitHub Pages)

on:
  push:
    branches:
      - claude/toddler-alphabet-numbers-app-66GQy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp kids-app/*.html _site/
          # Page d'accueil = l'application
          cp kids-app/index.html _site/index.html

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
